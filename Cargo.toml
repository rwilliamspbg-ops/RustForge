[workspace]
resolver = "2"
members = [
  "crates/core-tests",
  "crates/syntax-tests",
  "crates/semantic-tests",
  "crates/performance-tests",
  "crates/fuzz-tests",
  "crates/integration-tests",
  "crates/edge-cases",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

# Every crate opts in via `[lints] workspace = true`, replacing what used to
# be duplicated `#![forbid(unsafe_code)]` / `#![warn(missing_docs)]` inner
# attributes in each crate's lib.rs — one source of truth instead of seven.
# CI's `-D warnings` flag (see .github/workflows/ci.yml) is still what turns
# these into hard failures; this table just makes the policy itself
# persisted and discoverable rather than living only in a CI command line.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.metadata.rustforge]
# These names match the real `--features <name>` flag on the corresponding
# crate (performance-tests -> "perf", edge-cases -> "edge"), so they can be
# used directly, e.g. `cargo test -p performance-tests --features perf`.
default_categories = ["syntax", "semantic", "integration"]
optional_categories = ["perf", "fuzz", "edge"]
