[package]
name = "edge-cases"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
core-tests = { path = "../core-tests" }
# Pinned to the 1.8 line (rust-version 1.74) to stay within the workspace's
# MSRV, matching fuzz-tests' pin; see .github/dependabot.yml for the
# matching ignore rule.
proptest = { version = "~1.8", optional = true }

[features]
default = []
edge = ["dep:proptest"]
