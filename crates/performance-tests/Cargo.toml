[package]
name = "performance-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
# `[dev-dependencies]` can't be optional/feature-gated (see the `perf`
# feature below), so *any* `cargo test`/`cargo bench` invocation for this
# crate resolves criterion's whole transitive graph, regardless of whether
# `perf` is enabled. That graph moves fast — individual pieces (clap,
# clap_lex, ...) have independently jumped to requiring the `edition2024`
# Cargo feature, which breaks dependency *resolution* itself (not just
# compilation) under the workspace's MSRV toolchain. Pinning each offender
# one at a time isn't sustainable, so the `msrv` CI job instead excludes
# this crate from its `cargo test` step — see `.github/workflows/ci.yml`.
criterion = "0.5"

[features]
default = []
perf = []

[[bench]]
name = "sum_bench"
harness = false
required-features = ["perf"]
